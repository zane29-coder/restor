# Shared proxy settings for RESTOR's API locations.
# Installed to /etc/nginx/snippets/restor-proxy.conf.

proxy_pass http://restor_api_upstream;

proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Request-Id      $restor_request_id;

proxy_connect_timeout 10s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

# The app returns its own JSON error envelope; nginx must not replace it.
proxy_buffering off;
proxy_intercept_errors off;
