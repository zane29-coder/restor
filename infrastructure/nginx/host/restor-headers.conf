# Response headers shared by every RESTOR vhost.
# Installed to /etc/nginx/snippets/restor-headers.conf.
#
# Included per server rather than set once in `http`: nginx drops inherited
# `add_header` directives the moment a block defines one of its own, and this is
# a shared server where another site's config may do exactly that.
#
# For the same reason NO location in a RESTOR vhost may add a header of its own
# — it would silently lose all of these. Cache policy is therefore expressed as
# the `$restor_cache_control` map (see restor-ratelimit.conf) and applied once,
# here, instead of with per-location `expires`.

# No `includeSubDomains`: a sub-domain that is not yet in the certificate
# (courier.restor.uz, or anything added later) would become unreachable in
# every browser that had already seen this header. Add the flag once every
# sub-domain in use is served over TLS.
add_header Strict-Transport-Security "max-age=15552000" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Cache-Control by URI: immutable for content-hashed bundles, revalidate for
# everything else, never for the API.
add_header Cache-Control $restor_cache_control always;

# Deliberately NOT X-Frame-Options: Telegram renders the Mini App on
# tg.restor.uz inside a frame. The apps that must not be framed say so
# themselves — see the `X-Frame-Options` line in each staff vhost.
