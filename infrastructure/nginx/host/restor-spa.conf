# Locations shared by every RESTOR web-app vhost.
# Installed to /etc/nginx/snippets/restor-spa.conf.
#
# The API is proxied on each app's OWN host, so the browser sees it as
# same-origin: no CORS preflight on any request, no third-party-cookie rules to
# worry about, and nothing to reconfigure when a sub-domain is added. Every app
# therefore ships with `VITE_API_URL=/api/v1` and does not know its own domain.
#
# api.restor.uz exists for the clients that cannot be same-origin — the courier
# APK and the payment provider's callbacks.
#
# The vhost supplies `root`; these locations are identical everywhere.

# Login is the one endpoint where brute force is cheap and valuable.
location /api/v1/auth/login {
    limit_req zone=restor_auth burst=5 nodelay;
    include /etc/nginx/snippets/restor-proxy.conf;
}

location /api/ {
    limit_req zone=restor_api burst=40 nodelay;
    include /etc/nginx/snippets/restor-proxy.conf;
}

# Realtime (TZ §12). Needs the Upgrade dance and a long read timeout, or the
# socket is torn down every 60 seconds.
location /realtime/ {
    proxy_pass http://restor_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Product images, served straight off disk so Node never sees an image request.
# Reachable on every app host as well as api.restor.uz, because rows written to
# the database before the sub-domain move carry whichever host was current then.
location /uploads/ {
    alias /var/www/restor/uploads/;
    access_log off;
}

# SPA fallback: any unknown path is a client-side route, not a 404.
location / {
    try_files $uri $uri/ /index.html;
}
