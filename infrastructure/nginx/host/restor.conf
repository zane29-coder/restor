# =============================================================================
# RESTOR — site config for a SHARED host nginx.
#
# Installed to /etc/nginx/sites-available/restor and symlinked into
# sites-enabled. It adds one server block and touches nothing else, so the
# other sites already running on this server are unaffected.
#
# Requires /etc/nginx/conf.d/restor-ratelimit.conf for the zones and upstream.
#
# ONE domain, path-based routing — DuckDNS gives a single name, and one
# certificate is simpler to renew than four:
#
#   /          customer storefront
#   /admin/    admin panel
#   /pos/      POS terminal
#   /kds/      kitchen display
#   /tg/       Telegram Mini App
#   /api/      backend
#   /realtime/ websocket
#   /uploads/  product images
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name restore-1.duckdns.org;

    # Certbot's HTTP-01 challenge must stay on plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen … http2` rather than the separate `http2 on;` directive: the
    # latter needs nginx 1.25.1+, and this host runs 1.24.
    listen 443 ssl http2;
    # No `http2` on the IPv6 line: another site on this shared server already
    # set the protocol options for [::]:443, and repeating them makes nginx
    # warn "protocol options redefined". The socket's options are shared, so
    # HTTP/2 is active either way.
    listen [::]:443 ssl;
    server_name restore-1.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/restore-1.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/restore-1.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # No `includeSubDomains`: this is a DuckDNS host, and the flag would apply
    # to names this deployment does not control.
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Server level so it applies to every app without a regex location, which
    # would override the `alias` blocks below.
    add_header Cache-Control $restor_cache_control always;
    # Deliberately NOT X-Frame-Options DENY: Telegram renders the Mini App
    # inside a frame, and it is served from this same host at /tg/.

    # Product images are the largest upload (TZ §39).
    client_max_body_size 12M;

    limit_conn restor_conn 40;

    root /var/www/restor/customer;
    index index.html;

    access_log /var/log/nginx/restor-access.log;
    error_log  /var/log/nginx/restor-error.log warn;

    # ---------------------------------------------------------------- API ---

    # Login is the one endpoint where brute force is cheap and valuable.
    location /api/v1/auth/login {
        limit_req zone=restor_auth burst=5 nodelay;
        include /etc/nginx/snippets/restor-proxy.conf;
    }

    # Payment webhooks are exempt from rate limiting: the provider retries on
    # failure, and a dropped callback leaves an order unpaid (TZ §36).
    location /api/v1/payments/webhook {
        include /etc/nginx/snippets/restor-proxy.conf;
    }

    location /api/ {
        limit_req zone=restor_api burst=40 nodelay;
        include /etc/nginx/snippets/restor-proxy.conf;
    }

    location = /health {
        include /etc/nginx/snippets/restor-proxy.conf;
        access_log off;
    }

    # ----------------------------------------------------------- realtime ---

    location /realtime/ {
        proxy_pass http://restor_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Without a long read timeout the socket is torn down every 60s.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ------------------------------------------------------------ uploads ---

    location /uploads/ {
        alias /var/www/restor/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # --------------------------------------------------------------- apps ---
    # Each is a separate SPA built with `--base=/<path>/`, so its assets
    # resolve correctly under the sub-path.

    location /admin/ {
        alias /var/www/restor/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    location /pos/ {
        alias /var/www/restor/pos/;
        try_files $uri $uri/ /pos/index.html;
    }

    location /kds/ {
        alias /var/www/restor/kds/;
        try_files $uri $uri/ /kds/index.html;
    }

    location /tg/ {
        alias /var/www/restor/miniapp/;
        try_files $uri $uri/ /tg/index.html;
    }

    # Storefront SPA fallback — `/r/{slug}` and every other path reach the app,
    # which reads the slug and sends it as X-Tenant-Slug (TZ §47).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
