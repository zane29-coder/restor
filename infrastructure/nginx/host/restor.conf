# =============================================================================
# RESTOR — site config for a SHARED host nginx. ONE SUB-DOMAIN PER APP.
#
# Installed to /etc/nginx/sites-available/restor and symlinked into
# sites-enabled. It adds server blocks and touches nothing else, so the other
# sites already running on this server are unaffected.
#
#   restor.uz      customer storefront        (www.restor.uz redirects here)
#   app.restor.uz  admin panel
#   pos.restor.uz  POS terminal
#   kds.restor.uz  kitchen display
#   tg.restor.uz   Telegram Mini App
#   api.restor.uz  backend: /api/v1, /realtime, /uploads, /health
#
# Why a sub-domain each rather than the sub-paths this used to serve: a staff
# member types one name and lands in one app, a kiosk browser has nothing to
# navigate away from, each app gets its own cookie scope and its own access log,
# and every bundle is built with `--base=/` so no app needs to know where it is
# mounted. The cost is one DNS record per app and one more name on the
# certificate.
#
# Requires:
#   /etc/nginx/conf.d/restor-ratelimit.conf   zones, upstream, cache map
#   /etc/nginx/snippets/restor-proxy.conf     proxy_pass + forwarded headers
#   /etc/nginx/snippets/restor-tls.conf       certificate + TLS profile
#   /etc/nginx/snippets/restor-headers.conf   security + cache headers
#   /etc/nginx/snippets/restor-spa.conf       same-origin API + SPA fallback
#
# deploy-shared-host.sh installs all of them and validates with `nginx -t`
# before any reload.
# =============================================================================


# --- HTTP → HTTPS, plus the ACME challenge -----------------------------------
# One block for every name, including the legacy host: certbot's HTTP-01
# challenge must stay on plain HTTP, and /var/www/html is the webroot the host's
# certbot already uses.
server {
    listen 80;
    listen [::]:80;
    server_name restor.uz www.restor.uz api.restor.uz app.restor.uz
                pos.restor.uz kds.restor.uz tg.restor.uz
                restore-1.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# =============================================================================
# api.restor.uz — the backend
# =============================================================================
server {
    # `listen … http2` rather than the `http2 on;` directive: the latter needs
    # nginx 1.25.1+ and this host runs 1.24.
    #
    # The protocol options belong to the SOCKET, not to the server block, so
    # they are set here once and omitted from every block below. Repeating them
    # makes nginx warn "protocol options redefined" while changing nothing.
    listen 443 ssl http2;
    # No options on the IPv6 line: another site on this shared server already
    # set them for [::]:443.
    listen [::]:443 ssl;
    server_name api.restor.uz;

    include /etc/nginx/snippets/restor-tls.conf;
    include /etc/nginx/snippets/restor-headers.conf;

    # Product images are the largest upload (TZ §39).
    client_max_body_size 12M;
    limit_conn restor_conn 40;

    access_log /var/log/nginx/restor-api-access.log;
    error_log  /var/log/nginx/restor-api-error.log warn;

    # Login is the one endpoint where brute force is cheap and valuable.
    location /api/v1/auth/login {
        limit_req zone=restor_auth burst=5 nodelay;
        include /etc/nginx/snippets/restor-proxy.conf;
    }

    # Payment callbacks are exempt from rate limiting: the provider retries on
    # failure, and a dropped callback leaves an order unpaid (TZ §36). The path
    # is `/api/v1/webhooks/*` — that is what PaymentsWebhookController serves
    # and what the API advertises to Subo via API_BASE_URL.
    location /api/v1/webhooks/ {
        include /etc/nginx/snippets/restor-proxy.conf;
    }

    location /api/ {
        limit_req zone=restor_api burst=40 nodelay;
        include /etc/nginx/snippets/restor-proxy.conf;
    }

    # Probes bypass the version prefix and the rate limits.
    location = /health {
        include /etc/nginx/snippets/restor-proxy.conf;
        access_log off;
    }

    location = /health/ready {
        include /etc/nginx/snippets/restor-proxy.conf;
        access_log off;
    }

    location /realtime/ {
        proxy_pass http://restor_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # `API_BASE_URL=https://api.restor.uz`, so every image URL the API hands out
    # resolves here.
    location /uploads/ {
        alias /var/www/restor/uploads/;
        access_log off;
    }

    # No HTML is served from this host.
    location / {
        return 404;
    }
}


# =============================================================================
# restor.uz — customer storefront
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name restor.uz;

    include /etc/nginx/snippets/restor-tls.conf;
    include /etc/nginx/snippets/restor-headers.conf;

    client_max_body_size 12M;
    limit_conn restor_conn 40;

    access_log /var/log/nginx/restor-customer-access.log;
    error_log  /var/log/nginx/restor-customer-error.log warn;

    root /var/www/restor/customer;
    index index.html;

    # `/r/{slug}` and `/t/{qrToken}` fall through to the SPA, which reads the
    # slug and sends it as X-Tenant-Slug (TZ §47).
    include /etc/nginx/snippets/restor-spa.conf;
}

# www exists so a customer typing it does not get a certificate warning; it is
# not a second copy of the site.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.restor.uz;

    include /etc/nginx/snippets/restor-tls.conf;

    return 301 https://restor.uz$request_uri;
}


# =============================================================================
# app.restor.uz — admin panel
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.restor.uz;

    include /etc/nginx/snippets/restor-tls.conf;
    include /etc/nginx/snippets/restor-headers.conf;
    # Staff tools are never embedded by a third party. SAMEORIGIN rather than
    # DENY only so a future same-origin preview needs no config change —
    # nothing frames anything today (receipts print with `window.print()`).
    # The POS and KDS vhosts below carry the same header for the same reason;
    # tg.restor.uz deliberately carries none.
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 12M;
    limit_conn restor_conn 40;

    access_log /var/log/nginx/restor-admin-access.log;
    error_log  /var/log/nginx/restor-admin-error.log warn;

    root /var/www/restor/admin;
    index index.html;

    include /etc/nginx/snippets/restor-spa.conf;
}


# =============================================================================
# pos.restor.uz — POS terminal
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pos.restor.uz;

    include /etc/nginx/snippets/restor-tls.conf;
    include /etc/nginx/snippets/restor-headers.conf;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 12M;
    limit_conn restor_conn 40;

    access_log /var/log/nginx/restor-pos-access.log;
    error_log  /var/log/nginx/restor-pos-error.log warn;

    root /var/www/restor/pos;
    index index.html;

    include /etc/nginx/snippets/restor-spa.conf;
}


# =============================================================================
# kds.restor.uz — kitchen display
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kds.restor.uz;

    include /etc/nginx/snippets/restor-tls.conf;
    include /etc/nginx/snippets/restor-headers.conf;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # A kitchen screen runs unattended for a whole shift; its own access log
    # makes a polling problem obvious instead of burying it in the admin log.
    access_log /var/log/nginx/restor-kds-access.log;
    error_log  /var/log/nginx/restor-kds-error.log warn;

    limit_conn restor_conn 40;

    root /var/www/restor/kds;
    index index.html;

    include /etc/nginx/snippets/restor-spa.conf;
}


# =============================================================================
# tg.restor.uz — Telegram Mini App
# =============================================================================
# Register this host in @BotFather (`/newapp`, or Bot Settings → Menu Button).
# No X-Frame-Options here — Telegram renders the Mini App inside a frame, and
# the header would leave the user staring at a blank sheet.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tg.restor.uz;

    include /etc/nginx/snippets/restor-tls.conf;
    include /etc/nginx/snippets/restor-headers.conf;

    client_max_body_size 12M;
    limit_conn restor_conn 40;

    access_log /var/log/nginx/restor-tg-access.log;
    error_log  /var/log/nginx/restor-tg-error.log warn;

    root /var/www/restor/miniapp;
    index index.html;

    include /etc/nginx/snippets/restor-spa.conf;
}


# =============================================================================
# restore-1.duckdns.org — TRANSITIONAL, remove once nothing points here
# =============================================================================
# Two kinds of client still carry this host:
#
#  * Courier phones. The released APK has `https://restore-1.duckdns.org/api/v1`
#    baked into the binary, so the API must keep answering here until every
#    courier runs an APK built against api.restor.uz. A 301 is not a fix: an
#    HTTP client is not required to replay a POST body against the new location.
#  * Rows written to the database while this was the public host — product and
#    category images, tenant logos, user avatars — hold absolute URLs under it.
#    docs/deployment-shared-host.md has the one UPDATE that rewrites them; until
#    it has run, /uploads/ here is what keeps those images loading.
#
# The web paths redirect, because a browser follows a redirect happily and a
# bookmark should land on the new name.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name restore-1.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/restore-1.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/restore-1.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/restor-headers.conf;

    client_max_body_size 12M;
    limit_conn restor_conn 40;

    access_log /var/log/nginx/restor-legacy-access.log;
    error_log  /var/log/nginx/restor-legacy-error.log warn;

    location /api/v1/auth/login {
        limit_req zone=restor_auth burst=5 nodelay;
        include /etc/nginx/snippets/restor-proxy.conf;
    }

    location /api/v1/webhooks/ {
        include /etc/nginx/snippets/restor-proxy.conf;
    }

    location /api/ {
        limit_req zone=restor_api burst=40 nodelay;
        include /etc/nginx/snippets/restor-proxy.conf;
    }

    location = /health {
        include /etc/nginx/snippets/restor-proxy.conf;
        access_log off;
    }

    location /realtime/ {
        proxy_pass http://restor_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /uploads/ {
        alias /var/www/restor/uploads/;
        access_log off;
    }

    # The old sub-paths. `rewrite` rather than `return 301 … $request_uri`,
    # which would keep the prefix and send /admin/orders to app.restor.uz/admin/orders.
    rewrite ^/admin/?(.*)$ https://app.restor.uz/$1 permanent;
    rewrite ^/pos/?(.*)$   https://pos.restor.uz/$1 permanent;
    rewrite ^/kds/?(.*)$   https://kds.restor.uz/$1 permanent;
    rewrite ^/tg/?(.*)$    https://tg.restor.uz/$1  permanent;

    location / {
        return 301 https://restor.uz$request_uri;
    }
}


