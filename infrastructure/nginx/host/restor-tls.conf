# TLS for every RESTOR vhost.
# Installed to /etc/nginx/snippets/restor-tls.conf.
#
# ONE certificate covers restor.uz and all of its sub-domains, so every vhost
# references the same files. Let's Encrypt names the live directory after the
# certificate, not after the request — `--cert-name restor.uz` in
# init-ssl-host.sh is what keeps this path stable even when a sub-domain is
# added later.
#
# `options-ssl-nginx.conf` and `ssl-dhparams.pem` are written by certbot and
# carry the Mozilla intermediate profile: protocols, ciphers, session cache.
# Repeating those settings here would mean maintaining them by hand.

ssl_certificate     /etc/letsencrypt/live/restor.uz/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/restor.uz/privkey.pem;

include /etc/letsencrypt/options-ssl-nginx.conf;
ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
