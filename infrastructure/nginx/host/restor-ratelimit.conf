# Rate-limit zones for RESTOR.
#
# Installed to /etc/nginx/conf.d/restor-ratelimit.conf because `limit_req_zone`
# is only valid in the `http` context, while the site file lives in
# sites-enabled (a `server` context).
#
# Every name is prefixed `restor_` so it cannot collide with a zone another
# site on this shared server has already defined.

limit_req_zone  $binary_remote_addr  zone=restor_api:10m   rate=20r/s;
limit_req_zone  $binary_remote_addr  zone=restor_auth:10m  rate=2r/s;
limit_conn_zone $binary_remote_addr  zone=restor_conn:10m;

# Correlates a request across nginx, the API log and the browser.
map $http_x_request_id $restor_request_id {
  default $http_x_request_id;
  ""      $request_id;
}

upstream restor_api_upstream {
  # The API binds to loopback only; see docker-compose.server.yml.
  server 127.0.0.1:3100 max_fails=3 fail_timeout=15s;
  keepalive 32;
}

# Cache policy by URI.
#
# Done with a map applied once at server level rather than with a regex
# `location`: a regex location takes precedence over the prefix locations that
# use `alias`, and its `try_files` would then resolve against `root` instead of
# the alias — which is exactly how /admin/assets/*.js came to 404.
map $uri $restor_cache_control {
  default                                   "public, max-age=0, must-revalidate";
  # Vite emits content-hashed filenames, so bundles are immutable.
  "~*/assets/[^/]+\.(js|css)$"              "public, max-age=31536000, immutable";
  "~*\.(woff2?|ttf|eot)$"                   "public, max-age=31536000, immutable";
  "~*\.(png|jpe?g|webp|avif|svg|ico|gif)$"  "public, max-age=2592000";
}
