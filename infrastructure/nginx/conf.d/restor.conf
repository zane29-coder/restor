# --- tg.restor.uz — Telegram Mini App ----------------------------------------
# Register this host in @BotFather (`/newapp`, or Bot Settings → Menu Button).
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name tg.restor.uz;

  ssl_certificate     /etc/letsencrypt/live/restor.uz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/restor.uz/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Cache-Control $restor_cache_control always;
  # NO X-Frame-Options: Telegram renders the Mini App inside a frame, and the
  # header would leave the user staring at a blank sheet.

  access_log /var/log/nginx/restor-tg-access.log json;
  root /var/www/restor/miniapp;
  index index.html;

  location /api/v1/auth/login {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://restor_api;
    include /etc/nginx/conf.d/proxy-params.conf;
  }

  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://restor_api;
    include /etc/nginx/conf.d/proxy-params.conf;
  }

  location /uploads/ {
    alias /var/www/uploads/;
    access_log off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
