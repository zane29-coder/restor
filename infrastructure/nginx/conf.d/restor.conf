# =============================================================================
# RESTOR — site configuration.
#
# Replace every `restor.uz` with your own domain, then issue certificates with
# `infrastructure/deployment/init-ssl.sh`.
#
# Three virtual hosts:
#   api.restor.uz    → the single backend (TZ §3)
#   admin.restor.uz  → admin panel, POS and KDS bundles
#   restor.uz        → customer storefront and Mini App
# =============================================================================

# --- Shared security headers -------------------------------------------------
# Included by each TLS server below rather than set in `http`, because a header
# set at http level is dropped the moment a server block adds one of its own.
map $sent_http_content_type $restor_cache_control {
  default                    "public, max-age=0, must-revalidate";
  # Vite emits content-hashed filenames, so bundles are immutable.
  ~*application/javascript   "public, max-age=31536000, immutable";
  ~*text/css                 "public, max-age=31536000, immutable";
  ~*image/                   "public, max-age=2592000";
  ~*font/                    "public, max-age=31536000, immutable";
}

# --- HTTP → HTTPS, plus the ACME challenge ----------------------------------
server {
  listen 80;
  listen [::]:80;
  server_name restor.uz www.restor.uz api.restor.uz admin.restor.uz;

  # Certbot writes its challenge here; it must stay on plain HTTP.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# =============================================================================
# API
# =============================================================================
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name api.restor.uz;

  ssl_certificate     /etc/letsencrypt/live/restor.uz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/restor.uz/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_stapling on;
  ssl_stapling_verify on;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  limit_conn conn 40;

  # Login is the one endpoint where brute force is cheap and valuable.
  location /api/v1/auth/login {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://restor_api;
    include /etc/nginx/conf.d/proxy-params.conf;
  }

  # Payment webhooks must not be rate-limited: the provider retries on failure
  # and a dropped callback leaves an order unpaid (TZ §36).
  location /api/v1/payments/webhook {
    proxy_pass http://restor_api;
    include /etc/nginx/conf.d/proxy-params.conf;
  }

  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://restor_api;
    include /etc/nginx/conf.d/proxy-params.conf;
  }

  # Realtime (TZ §12). Needs the Upgrade dance and a long read timeout, or the
  # socket is torn down every 60 seconds.
  location /realtime/ {
    proxy_pass http://restor_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Product images written by the API when STORAGE_PROVIDER=LOCAL. Served
  # straight off disk so Node never touches an image request.
  location /uploads/ {
    alias /var/www/uploads/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    access_log off;
  }

  # Probes bypass the version prefix and the rate limits.
  location = /health {
    proxy_pass http://restor_api;
    include /etc/nginx/conf.d/proxy-params.conf;
    access_log off;
  }

  location / {
    return 404;
  }
}

# =============================================================================
# Admin panel + POS + KDS
# =============================================================================
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name admin.restor.uz;

  ssl_certificate     /etc/letsencrypt/live/restor.uz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/restor.uz/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  root /var/www/restor/admin;
  index index.html;

  # Same-origin API: the apps ship with VITE_API_URL=/api/v1, so there is no
  # CORS preflight on any request.
  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://restor_api;
    include /etc/nginx/conf.d/proxy-params.conf;
  }

  location /realtime/ {
    proxy_pass http://restor_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location /uploads/ {
    alias /var/www/uploads/;
    expires 30d;
    access_log off;
  }

  # POS and KDS are served from the same host as separate SPAs.
  location /pos/ {
    alias /var/www/restor/pos/;
    try_files $uri $uri/ /pos/index.html;
  }

  location /kds/ {
    alias /var/www/restor/kds/;
    try_files $uri $uri/ /kds/index.html;
  }

  location /assets/ {
    add_header Cache-Control $restor_cache_control;
  }

  # SPA fallback: any unknown path is a client-side route.
  location / {
    try_files $uri $uri/ /index.html;
  }
}

# =============================================================================
# Customer storefront + Telegram Mini App
# =============================================================================
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name restor.uz www.restor.uz;

  ssl_certificate     /etc/letsencrypt/live/restor.uz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/restor.uz/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # NOT X-Frame-Options DENY: Telegram renders the Mini App inside a frame.

  root /var/www/restor/customer;
  index index.html;

  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://restor_api;
    include /etc/nginx/conf.d/proxy-params.conf;
  }

  location /uploads/ {
    alias /var/www/uploads/;
    expires 30d;
    access_log off;
  }

  location /tg/ {
    alias /var/www/restor/miniapp/;
    try_files $uri $uri/ /tg/index.html;
  }

  location /assets/ {
    add_header Cache-Control $restor_cache_control;
  }

  # `/r/{slug}` and every other path fall through to the SPA, which reads the
  # slug and sends it as X-Tenant-Slug (TZ §47).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
