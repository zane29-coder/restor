# =============================================================================
# RESTOR — site configuration for the self-contained Docker stack
# (docker-compose.prod.yml, where nginx runs in a container and owns 80/443).
#
# Replace every `restor.uz` with your own domain, then issue certificates with
# `infrastructure/deployment/init-ssl.sh`.
#
# ONE SUB-DOMAIN PER APP — the same layout as the shared-host config in
# infrastructure/nginx/host/restor.conf, so moving between the two deployment
# styles does not change a single URL:
#
#   restor.uz      customer storefront        (www.restor.uz redirects here)
#   app.restor.uz  admin panel
#   pos.restor.uz  POS terminal
#   kds.restor.uz  kitchen display
#   tg.restor.uz   Telegram Mini App
#   api.restor.uz  backend: /api/v1, /realtime, /uploads, /health
#
# Each bundle is built with `--base=/` and mounted at the root of its own host,
# which is why none of them needs to know where it is served from.
# =============================================================================

# --- Cache policy by URI -----------------------------------------------------
# A map applied once per server rather than a regex `location`: a regex location
# outranks the prefix locations and would change which root `try_files` resolves
# against. Entries are regexes and the FIRST match wins, so the API rule comes
# before the extension rules — `/api/v1/products/x.png` is a response, not a file.
map $uri $restor_cache_control {
  default                                   "public, max-age=0, must-revalidate";
  # A cached API response is a stale order board.
  "~^/(api|realtime|health)"                "no-store";
  # Vite emits content-hashed filenames, so bundles are immutable.
  "~*/assets/[^/]+\.(js|css)$"              "public, max-age=31536000, immutable";
  "~*\.(woff2?|ttf|eot)$"                   "public, max-age=31536000, immutable";
  "~*\.(png|jpe?g|webp|avif|svg|ico|gif)$"  "public, max-age=2592000";
}

# --- HTTP → HTTPS, plus the ACME challenge -----------------------------------
server {
  listen 80;
  listen [::]:80;
  server_name restor.uz www.restor.uz api.restor.uz app.restor.uz
              pos.restor.uz kds.restor.uz tg.restor.uz;

  # Certbot writes its challenge here; it must stay on plain HTTP.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# =============================================================================
# api.restor.uz — the backend
# =============================================================================
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name api.restor.uz;

  ssl_certificate     /etc/letsencrypt/live/restor.uz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/restor.uz/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_stapling on;
  ssl_stapling_verify on;

  # Set per server, not in `http`: nginx drops inherited `add_header` directives
  # the moment a block defines one of its own. For the same reason no location
  # below adds a header — cache policy comes from the map instead of `expires`.
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Cache-Control $restor_cache_control always;

  limit_conn conn 40;

  # Login is the one endpoint where brute force is cheap and valuable.
  location /api/v1/auth/login {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://restor_api;
    include /etc/nginx/conf.d/proxy-params.conf;
  }

  # Payment callbacks must not be rate-limited: the provider retries on failure
  # and a dropped callback leaves an order unpaid (TZ §36). `/api/v1/webhooks/*`
  # is what PaymentsWebhookController serves and what the API advertises.
  location /api/v1/webhooks/ {
    proxy_pass http://restor_api;
    include /etc/nginx/conf.d/proxy-params.conf;
  }

  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://restor_api;
    include /etc/nginx/conf.d/proxy-params.conf;
  }

  # Realtime (TZ §12). Needs the Upgrade dance and a long read timeout, or the
  # socket is torn down every 60 seconds.
  location /realtime/ {
    proxy_pass http://restor_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Product images written by the API when STORAGE_PROVIDER=LOCAL. Served
  # straight off disk so Node never touches an image request. `API_BASE_URL`
  # must name this host, or the URLs in the database point somewhere else.
  location /uploads/ {
    alias /var/www/uploads/;
    access_log off;
  }

  # Probes bypass the version prefix and the rate limits.
  location = /health {
    proxy_pass http://restor_api;
    include /etc/nginx/conf.d/proxy-params.conf;
    access_log off;
  }

  location = /health/ready {
    proxy_pass http://restor_api;
    include /etc/nginx/conf.d/proxy-params.conf;
    access_log off;
  }

  # No HTML is served from this host.
  location / {
    return 404;
  }
}

# =============================================================================
# The five web apps
# =============================================================================
# Every block below is the same except for `server_name`, `root` and whether
# framing is allowed. The repetition is deliberate: nginx has no loop, and a
# shared `include` would hide which app each log file and root belongs to.

# --- restor.uz — customer storefront ----------------------------------------
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name restor.uz;

  ssl_certificate     /etc/letsencrypt/live/restor.uz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/restor.uz/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Cache-Control $restor_cache_control always;

  access_log /var/log/nginx/restor-customer-access.log json;
  root /var/www/restor/customer;
  index index.html;

  location /api/v1/auth/login {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://restor_api;
    include /etc/nginx/conf.d/proxy-params.conf;
  }

  # Same-origin API: the apps ship with VITE_API_URL=/api/v1, so there is no
  # CORS preflight on any request.
  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://restor_api;
    include /etc/nginx/conf.d/proxy-params.conf;
  }

  location /realtime/ {
    proxy_pass http://restor_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Also served here, not only on api.restor.uz: rows written while an older
  # host was public carry absolute URLs under it.
  location /uploads/ {
    alias /var/www/uploads/;
    access_log off;
  }

  # `/r/{slug}` and `/t/{qrToken}` fall through to the SPA, which reads the slug
  # and sends it as X-Tenant-Slug (TZ §47).
  location / {
    try_files $uri $uri/ /index.html;
  }
}

# www exists so a customer typing it does not get a certificate warning; it is
# not a second copy of the site.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name www.restor.uz;

  ssl_certificate     /etc/letsencrypt/live/restor.uz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/restor.uz/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  return 301 https://restor.uz$request_uri;
}

# --- app.restor.uz — admin panel ---------------------------------------------
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name app.restor.uz;

  ssl_certificate     /etc/letsencrypt/live/restor.uz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/restor.uz/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Cache-Control $restor_cache_control always;
  # Staff tools are never embedded by a third party. SAMEORIGIN rather than
  # DENY only so a future same-origin preview needs no config change — nothing
  # frames anything today (receipts print with `window.print()`). The POS and
  # KDS vhosts carry the same header; tg.restor.uz deliberately carries none.
  add_header X-Frame-Options "SAMEORIGIN" always;

  access_log /var/log/nginx/restor-admin-access.log json;
  root /var/www/restor/admin;
  index index.html;

  location /api/v1/auth/login {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://restor_api;
    include /etc/nginx/conf.d/proxy-params.conf;
  }

  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://restor_api;
    include /etc/nginx/conf.d/proxy-params.conf;
  }

  location /realtime/ {
    proxy_pass http://restor_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location /uploads/ {
    alias /var/www/uploads/;
    access_log off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

