# Shared proxy settings for every location that forwards to the API.

proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# Generated by nginx when the client did not send one; the API logs it and
# echoes it back, so one id traces a request end to end.
proxy_set_header X-Request-Id      $request_id_final;

proxy_connect_timeout 10s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

# Streaming responses (and future SSE) must not sit in nginx's buffer.
proxy_buffering off;

# nginx already returns a clean error page; the app's own JSON error body is
# what clients parse, so upstream errors pass through untouched.
proxy_intercept_errors off;
