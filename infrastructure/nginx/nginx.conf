user nginx;
# One worker per core; nginx works this out itself better than we can.
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # The request id is generated here and passed to the API, which logs it and
  # returns it — so one id traces a request across nginx, the app and the
  # browser's network tab (TZ §59).
  map $http_x_request_id $request_id_final {
    default   $http_x_request_id;
    ""        $request_id;
  }

  log_format json escape=json
    '{"time":"$time_iso8601","request_id":"$request_id_final",'
    '"remote_addr":"$remote_addr","method":"$request_method",'
    '"uri":"$request_uri","status":$status,'
    '"bytes":$body_bytes_sent,"duration":$request_time,'
    '"referer":"$http_referer","agent":"$http_user_agent"}';

  access_log /var/log/nginx/access.log json;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  server_tokens off;

  # Product images are the largest thing a client uploads (TZ §39).
  client_max_body_size 12M;
  client_body_timeout 30s;
  client_header_timeout 30s;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types
    text/plain text/css text/javascript
    application/javascript application/json application/xml
    image/svg+xml font/woff font/woff2;

  # Rate limits: a second line of defence behind the app's own throttler.
  # `$binary_remote_addr` keys on IP; 10m holds roughly 160k addresses.
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;
  limit_conn_zone $binary_remote_addr zone=conn:10m;

  # Upstream so a restart of the API is retried rather than 502'd instantly.
  upstream restor_api {
    server api:3000 max_fails=3 fail_timeout=15s;
    keepalive 32;
  }

  include /etc/nginx/conf.d/*.conf;
}
