# =============================================================================
# RESTOR — production stack for a single VPS.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Design notes:
#  * Only nginx publishes ports. Postgres, Redis and the API are reachable only
#    on the internal network, so a misconfigured firewall cannot expose the
#    database to the internet.
#  * The API runs migrations at start-up (`migrate deploy`, idempotent), so a
#    rolling restart is safe.
#  * Web apps are built into static bundles and served by nginx — there is no
#    Node process behind them.
# =============================================================================

name: restor

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    # Deliberately no `ports:` — nothing outside this network needs Postgres.

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    restart: always
    env_file: [./backend/.env.prod]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public&connection_limit=20
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    volumes:
      # Product images when STORAGE_PROVIDER=LOCAL. Switch to S3/MinIO before
      # running more than one API replica — local disk is not shared.
      - api_storage:/app/backend/storage
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructure/nginx/www:/var/www/restor:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
      - api_storage:/var/www/uploads:ro
    depends_on: [api]
    networks: [internal]

  # Renews the TLS certificates twice a day; exits between runs.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do certbot renew --webroot -w /var/www/certbot --quiet;
             sleep 12h & wait $${!}; done"
    networks: [internal]

volumes:
  postgres_data:
  redis_data:
  api_storage:
  certbot_certs:
  certbot_webroot:

networks:
  internal:
    driver: bridge
